name: CI / Build / Release

on:
  push:
    branches: [ main ]
    tags:     [ 'v*.*.*' ]      # сборка релиза только на семвер-тегах
  pull_request:
    branches: [ main ]
  workflow_dispatch:            # ручной запуск из UI GitHub

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # =================================================================
  # LINT — ruff закреплённой версии (requirements-dev.txt)
  # =================================================================
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  # =================================================================
  # TEST — core + интеграция с huawei-lte-api + UI в тестовом режиме.
  # Python 3.11 — версия Android-сборки; 3.14 — самая новая.
  # UI-тесты идут под Xvfb; Kivy ставится только на 3.11 (версия
  # рецепта python-for-android), на остальных Android-UI пропускается.
  # =================================================================
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: [ '3.11', '3.12', '3.13', '3.14' ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt
      - name: Install system packages for UI tests
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 libegl1 libmtdev1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Install Kivy (Android UI tests)
        if: matrix.python == '3.11'
        run: pip install "kivy==2.3.0"
      - name: Run pytest (with coverage of core)
        run: xvfb-run -a pytest -q --cov=core --cov-report=term --cov-fail-under=90

  # =================================================================
  # BUILD — Windows: portable-папка (zip) и однофайловый .exe,
  # только после lint + test
  # =================================================================
  build-windows:
    needs: [ lint, test ]
    runs-on: windows-latest
    permissions:
      contents: write           # нужно для создания Release
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: 'pip'
        cache-dependency-path: requirements-build.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-build.txt -r requirements-dev.txt

    # Те же тесты на настоящей Windows: Tk-интерфейс, winsound, пути,
    # список нативных модулей pycryptodomex для сборки.
    - name: Run pytest on Windows
      run: pytest -q

    - name: Resolve version
      shell: pwsh
      run: |
        $ver = python -c "import core; print(core.__version__)"
        if ($env:GITHUB_REF -like 'refs/tags/v*') {
          if ("v$ver" -ne $env:GITHUB_REF_NAME) {
            Write-Error "Тег $env:GITHUB_REF_NAME не совпадает с core.__version__ = $ver"
            exit 1
          }
          $base = "Hua4GMon-v$ver"
        } else {
          $base = "Hua4GMon-v$ver-dev-$($env:GITHUB_SHA.Substring(0, 7))"
        }
        "EXE_NAME=$base.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
        "ZIP_BASE=$base-windows" | Out-File -FilePath $env:GITHUB_ENV -Append
        "ZIP_NAME=$base-windows.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

    # Один анализ — две сборки (packaging/windows.spec):
    #   dist/Hua4GMon/            portable-папка, запускается без распаковки;
    #   dist/Hua4GMon-onefile.exe один файл с заставкой на время распаковки.
    - name: Build Windows app
      run: pyinstaller --noconfirm packaging/windows.spec

    # --self-test проверяет в собранном виде библиотеку, криптографию и
    # окно программы; время — от запуска до выхода, у однофайлового .exe
    # вместе с распаковкой.
    - name: Smoke-test builds
      shell: pwsh
      timeout-minutes: 5
      run: |
        $summary = @('### Самопроверка Windows-сборок', '', '| Сборка | Запуск и проверка | Итог |', '|---|---|---|')
        $failed = $false
        foreach ($exe in @('dist/Hua4GMon/Hua4GMon.exe', 'dist/Hua4GMon-onefile.exe')) {
          $report = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetFileNameWithoutExtension($exe) + '-selftest.txt')
          $watch = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process $exe -ArgumentList '--self-test', $report -PassThru -Wait
          $sec = [math]::Round($watch.Elapsed.TotalSeconds, 1)
          $result = if ($p.ExitCode -eq 0) { 'OK' } else { "код $($p.ExitCode)" }
          Write-Host ('== {0}: {1}, {2} с' -f $exe, $result, $sec)
          if (Test-Path $report) { Get-Content $report | Write-Host }
          $summary += '| {0} | {1} с | {2} |' -f $exe, $sec, $result
          if ($p.ExitCode -ne 0) { $failed = $true }
        }
        $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
        if ($failed) { Write-Error 'Самопроверка собранной программы не пройдена'; exit 1 }

    - name: Stage release assets
      shell: pwsh
      run: |
        Copy-Item dist/Hua4GMon-onefile.exe $env:EXE_NAME
        # Архив с папкой Hua4GMon (Hua4GMon.exe + _internal) внутри.
        python -c "import shutil, sys; shutil.make_archive(sys.argv[1], 'zip', 'dist', 'Hua4GMon')" $env:ZIP_BASE
        foreach ($pair in @(@('EXE', $env:EXE_NAME), @('ZIP', $env:ZIP_NAME))) {
          $file = $pair[1]
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash
          "$hash  $file" | Out-File -Encoding ascii "$file.sha256"
          "$($pair[0])_HASH=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$($pair[0])_SIZE=$([math]::Round((Get-Item $file).Length / 1MB, 1)) МБ" |
              Out-File -FilePath $env:GITHUB_ENV -Append
        }

    - name: Upload artifact (для push и PR)
      uses: actions/upload-artifact@v7
      with:
        name: Hua4GMon-Windows
        path: |
          ${{ env.ZIP_NAME }}
          ${{ env.ZIP_NAME }}.sha256
          ${{ env.EXE_NAME }}
          ${{ env.EXE_NAME }}.sha256

    - name: Create GitHub Release (только на тегах vX.Y.Z)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v3
      with:
        files: |
          ${{ env.ZIP_NAME }}
          ${{ env.ZIP_NAME }}.sha256
          ${{ env.EXE_NAME }}
          ${{ env.EXE_NAME }}.sha256
          README.md
          LICENSE
          LICENSES/LGPL-3.0.txt
          LICENSES/GPL-3.0.txt
          LICENSES/DejaVu-Fonts.txt
        body: |
          **Hua4GMon ${{ github.ref_name }}** — Windows (portable) и Android APK.

          **Windows — рекомендуется `${{ env.ZIP_NAME }}`** (${{ env.ZIP_SIZE }}).
          Распакуйте один раз (например, в `C:\Hua4GMon` или на флешку) и
          запускайте `Hua4GMon.exe` из папки. Открывается за секунды даже на
          слабом ноутбуке. Установка не нужна.

          **Windows — один файл `${{ env.EXE_NAME }}`** (${{ env.EXE_SIZE }}).
          Удобно переносить, но при каждом запуске распаковывается во
          временную папку, а антивирус проверяет её заново: на слабом ПК
          старт может занять минуту и больше (всё это время видна заставка).

          **Android:** установите `Hua4GMon-${{ github.ref_name }}.apk`
          (Android 7–16).

          **SHA256:**
          ```
          ${{ env.ZIP_HASH }}  ${{ env.ZIP_NAME }}
          ${{ env.EXE_HASH }}  ${{ env.EXE_NAME }}
          ```

          **⚠ Windows SmartScreen:** при первом запуске неподписанной
          программы Windows может предупредить «Неизвестный издатель».
          Это нормально. Жмите «Подробнее» → «Выполнить в любом случае».
          См. README → раздел Windows SmartScreen.

          **⚠ Если Windows ругается на «не удаётся открыть»**, выполните
          в PowerShell перед распаковкой или запуском:
          ```powershell
          Unblock-File .\${{ env.ZIP_NAME }}
          Unblock-File .\${{ env.EXE_NAME }}
          ```

          Полный список изменений: [CHANGELOG.md](CHANGELOG.md).
