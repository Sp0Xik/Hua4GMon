name: CI / Build / Release

on:
  push:
    branches: [ main ]
    tags:     [ 'v*.*.*' ]      # сборка релиза только на семвер-тегах
  pull_request:
    branches: [ main ]
  workflow_dispatch:            # ручной запуск из UI GitHub

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # =================================================================
  # LINT — ruff закреплённой версии (requirements-dev.txt)
  # =================================================================
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  # =================================================================
  # TEST — core + интеграция с huawei-lte-api + UI в тестовом режиме.
  # Python 3.11 — версия Android-сборки; 3.14 — самая новая.
  # UI-тесты идут под Xvfb; Kivy ставится только на 3.11 (версия
  # рецепта python-for-android), на остальных Android-UI пропускается.
  # =================================================================
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: [ '3.11', '3.12', '3.13', '3.14' ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt
      - name: Install system packages for UI tests
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 libegl1 libmtdev1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Install Kivy (Android UI tests)
        if: matrix.python == '3.11'
        run: pip install "kivy==2.3.0"
      - name: Run pytest (with coverage of core)
        run: xvfb-run -a pytest -q --cov=core --cov-report=term --cov-fail-under=90

  # =================================================================
  # BUILD — portable Windows .exe (один файл), только после lint + test
  # =================================================================
  build-windows:
    needs: [ lint, test ]
    runs-on: windows-latest
    permissions:
      contents: write           # нужно для создания Release
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: 'pip'
        cache-dependency-path: requirements-build.txt

    # Загрузчик PyInstaller (часть .exe, которая распаковывает и запускает
    # программу) собирается из исходников компилятором MSVC раннера.
    # Готовый загрузчик из PyPI встроен во множество чужих программ, в том
    # числе вредоносных, и браузеры с антивирусами чаще принимают .exe с ним
    # за опасный; собственную сборку для этого рекомендует документация
    # PyInstaller («Building the Bootloader»).
    - name: Install dependencies (PyInstaller bootloader from source)
      env:
        PYINSTALLER_COMPILE_BOOTLOADER: '1'
      run: |
        python -m pip install --upgrade pip
        pip install --no-binary pyinstaller -r requirements-build.txt -r requirements-dev.txt

    - name: Verify self-built bootloader
      shell: pwsh
      run: |
        $ver = python -c "import PyInstaller; print(PyInstaller.__version__)"
        $dir = Join-Path $env:RUNNER_TEMP 'pyinstaller-pypi'
        pip download "pyinstaller==$ver" --no-deps --only-binary=:all: -d $dir
        $wheel = Get-ChildItem $dir -Filter '*.whl' | Select-Object -First 1
        python tools/bootloader_check.py $wheel.FullName
        if ($LASTEXITCODE -ne 0) { Write-Error 'В сборку попал бы готовый загрузчик PyInstaller из PyPI'; exit 1 }

    # Те же тесты на настоящей Windows: Tk-интерфейс, winsound, пути,
    # список нативных модулей pycryptodomex для сборки.
    - name: Run pytest on Windows
      run: pytest -q

    - name: Resolve version
      shell: pwsh
      run: |
        $ver = python -c "import core; print(core.__version__)"
        if ($env:GITHUB_REF -like 'refs/tags/v*') {
          if ("v$ver" -ne $env:GITHUB_REF_NAME) {
            Write-Error "Тег $env:GITHUB_REF_NAME не совпадает с core.__version__ = $ver"
            exit 1
          }
          $exeName = "Hua4GMon-v$ver.exe"
        } else {
          $exeName = "Hua4GMon-v$ver-dev-$($env:GITHUB_SHA.Substring(0, 7)).exe"
        }
        "EXE_NAME=$exeName" | Out-File -FilePath $env:GITHUB_ENV -Append

    # Все параметры сборки — в packaging/windows.spec: один .exe без лишних
    # файлов, заставка с ходом запуска, VERSIONINFO из core.__version__.
    - name: Build single-file EXE
      run: pyinstaller --noconfirm packaging/windows.spec

    # --self-test проверяет в собранном .exe библиотеку роутера,
    # криптографию и окно программы. Время — от запуска до выхода, вместе
    # с распаковкой; оно попадает в Summary задачи.
    - name: Smoke-test EXE
      shell: pwsh
      timeout-minutes: 5
      run: |
        $report = Join-Path $env:RUNNER_TEMP 'selftest.txt'
        $watch = [Diagnostics.Stopwatch]::StartNew()
        $p = Start-Process dist/Hua4GMon.exe -ArgumentList '--self-test', $report -PassThru -Wait
        $sec = [math]::Round($watch.Elapsed.TotalSeconds, 1)
        $result = if ($p.ExitCode -eq 0) { 'OK' } else { "код $($p.ExitCode)" }
        Write-Host "== Hua4GMon.exe --self-test: $result, $sec с"
        if (Test-Path $report) { Get-Content $report | Write-Host }
        @('### Самопроверка Windows .exe', '',
          "Запуск с распаковкой и проверка: **$sec с** — $result") |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
        if ($p.ExitCode -ne 0) { Write-Error 'Самопроверка собранного .exe не пройдена'; exit 1 }

    - name: Stage release assets
      shell: pwsh
      run: |
        Copy-Item dist/Hua4GMon.exe $env:EXE_NAME
        $hash = (Get-FileHash $env:EXE_NAME -Algorithm SHA256).Hash
        "$hash  $env:EXE_NAME" | Out-File -Encoding ascii "$env:EXE_NAME.sha256"
        "EXE_HASH=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append
        "EXE_SIZE=$([math]::Round((Get-Item $env:EXE_NAME).Length / 1MB, 1)) МБ" |
            Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Upload artifact (для push и PR)
      uses: actions/upload-artifact@v7
      with:
        name: Hua4GMon-Windows
        path: |
          ${{ env.EXE_NAME }}
          ${{ env.EXE_NAME }}.sha256

    - name: Create GitHub Release (только на тегах vX.Y.Z)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v3
      with:
        files: |
          ${{ env.EXE_NAME }}
          ${{ env.EXE_NAME }}.sha256
          README.md
          LICENSE
          LICENSES/LGPL-3.0.txt
          LICENSES/GPL-3.0.txt
          LICENSES/DejaVu-Fonts.txt
        body: |
          **Hua4GMon ${{ github.ref_name }}** — portable Windows .exe и Android APK.

          **Windows:** скачайте `${{ env.EXE_NAME }}` и запустите. Установка
          не требуется, это один файл — можно носить на флешке. Пока программа
          запускается, видна заставка с ходом запуска.

          **Android:** установите `Hua4GMon-${{ github.ref_name }}.apk`
          (Android 7–16).

          **Размер .exe:** ${{ env.EXE_SIZE }}
          **SHA256 .exe:**
          ```
          ${{ env.EXE_HASH }}
          ```

          **⚠ Windows SmartScreen:** при первом запуске неподписанного
          .exe Windows может предупредить «Неизвестный издатель».
          Это нормально. Жмите «Подробнее» → «Выполнить в любом случае».

          **⚠ Если браузер или антивирус блокирует файл** — это ложное
          срабатывание на неподписанную программу. Сверьте SHA256 выше
          (PowerShell: `Get-FileHash .\${{ env.EXE_NAME }}`) и см. README →
          раздел Windows.

          **⚠ Если Windows ругается на «не удаётся открыть» .exe**,
          выполните в PowerShell:
          ```powershell
          Unblock-File .\${{ env.EXE_NAME }}
          ```

          Полный список изменений: [CHANGELOG.md](CHANGELOG.md).
