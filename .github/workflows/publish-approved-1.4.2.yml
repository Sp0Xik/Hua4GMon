name: Publish approved 1.4.2 release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-approved-1.4.2.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: publish-approved-1.4.2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_SHA: 0849db98b8dd54b9428f0d4b3774f2dd4c48efff
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 0849db98b8dd54b9428f0d4b3774f2dd4c48efff
          persist-credentials: false
      - name: Build, verify and publish approved release
        shell: python
        run: |
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess
          import time

          repo = os.environ['GH_REPO']
          target = os.environ['RELEASE_SHA']
          tag = 'v1.4.2'
          version = re.search(r'__version__ = "([^"]+)"', pathlib.Path('core/__init__.py').read_text()).group(1)
          assert version == '1.4.2'

          def gh(*args, optional=False):
              result = subprocess.run(['gh', *args], text=True, capture_output=True, timeout=120)
              if result.returncode:
                  if optional and 'HTTP 404' in result.stderr:
                      return None
                  raise RuntimeError(result.stderr)
              return result.stdout

          ref = gh('api', f'repos/{repo}/git/ref/tags/{tag}', optional=True)
          if ref is None:
              gh('api', '--method', 'POST', f'repos/{repo}/git/refs',
                 '-f', f'ref=refs/tags/{tag}', '-f', f'sha={target}')
          else:
              assert json.loads(ref)['object']['sha'] == target, 'Existing tag points elsewhere'

          def runs(workflow):
              return json.loads(gh('run', 'list', '--repo', repo, '--workflow', workflow,
                  '--branch', tag, '--commit', target, '--event', 'workflow_dispatch',
                  '--limit', '20', '--json', 'databaseId,status,conclusion,url'))

          workflows = ('build.yml', 'build-android.yml')
          for workflow in workflows:
              if not runs(workflow):
                  gh('workflow', 'run', workflow, '--repo', repo, '--ref', tag)
          pending = set(workflows)
          deadline = time.monotonic() + 140 * 60
          while pending:
              if time.monotonic() > deadline:
                  raise TimeoutError('Release builds did not finish')
              for workflow in list(pending):
                  found = runs(workflow)
                  if not found:
                      continue
                  run = found[0]
                  print(workflow, run['status'], run['conclusion'], run['url'], flush=True)
                  if run['status'] == 'completed':
                      assert run['conclusion'] == 'success', f"Build failed: {run['url']}"
                      pending.remove(workflow)
              if pending:
                  time.sleep(20)

          release = json.loads(gh('release', 'view', tag, '--repo', repo,
                                  '--json', 'assets,isDraft,url'))
          expected = {'Hua4GMon-v1.4.2.exe', 'Hua4GMon-v1.4.2.exe.sha256',
                      'Hua4GMon-v1.4.2.apk', 'Hua4GMon-v1.4.2.apk.sha256',
                      'README.md', 'LICENSE', 'LGPL-3.0.txt', 'GPL-3.0.txt',
                      'DejaVu-Fonts.txt', 'THIRD-PARTY-NOTICES.txt'}
          present = {asset['name'] for asset in release['assets'] if asset['size'] > 0}
          assert expected <= present, f'Missing assets: {expected - present}'
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'release-check'
          destination.mkdir(exist_ok=True)
          gh('release', 'download', tag, '--repo', repo, '--dir', str(destination),
             '--pattern', '*.exe', '--pattern', '*.apk', '--pattern', '*.sha256', '--clobber')
          hashes = []
          for name in ('Hua4GMon-v1.4.2.exe', 'Hua4GMon-v1.4.2.apk'):
              expected_hash, expected_name = (destination / (name + '.sha256')).read_text(encoding='utf-8-sig').split()
              assert expected_name.lstrip('*') == name
              actual = hashlib.sha256((destination / name).read_bytes()).hexdigest()
              assert actual.lower() == expected_hash.lower(), f'Hash mismatch: {name}'
              hashes.append(f'{actual}  {name}')

          changelog = pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8')
          changes = changelog.split('## [1.4.2] - 2026-11-06', 1)[1].split('## [1.4.1]', 1)[0].strip()
          fence = chr(96) * 3
          notes = '\n'.join([
              '**Hua4GMon 1.4.2** — мониторинг сигнала и настройка LTE/5G-антенн Huawei.',
              '', '## Скачать',
              '- **Windows:** Hua4GMon-v1.4.2.exe — один portable-файл, установка не требуется.',
              '- **Android:** Hua4GMon-v1.4.2.apk — подписанная сборка.',
              '', '## Что изменилось', changes,
              '', '## SHA256', fence, *hashes, fence,
              '', 'Лицензии и уведомления сторонних компонентов приложены к релизу.',
              'На части устройств Android со страницами памяти 16 КБ APK может не запуститься: ограничение текущего сборочного стека.',
              '', f'[Полный список изменений](https://github.com/{repo}/blob/{tag}/CHANGELOG.md)',
          ])
          notes_file = destination / 'release-notes.md'
          notes_file.write_text(notes, encoding='utf-8')
          gh('release', 'edit', tag, '--repo', repo, '--title', 'Hua4GMon 1.4.2',
             '--notes-file', str(notes_file), '--draft=false', '--latest')
          published = json.loads(gh('release', 'view', tag, '--repo', repo, '--json', 'isDraft,url'))
          assert published['isDraft'] is False
          print('Published:', published['url'], flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Published ' + published['url'] + '\n')
