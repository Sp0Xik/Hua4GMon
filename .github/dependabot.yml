# Автоматические предложения обновлений зависимостей.
#
# requirements.txt — единственный источник версий: Android-сборка берёт
# версии из него (tools/android_requirements.py), уведомления о лицензиях
# собираются при сборке из установленных пакетов
# (tools/third_party_notices.py). Ручных правок после обновления нет.
# Каждый PR проверяет новые версии полностью: тесты на Python 3.11–3.14
# (в том числе с настоящей huawei-lte-api против поддельного роутера),
# сборка .exe и его самопроверка на Windows, тесты Android-интерфейса и
# сборка APK. Зелёный PR можно сливать.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      runtime:
        patterns: [ "huawei-lte-api", "requests", "urllib3", "certifi",
                    "idna", "charset-normalizer", "xmltodict", "pycryptodomex" ]
      dev-tools:
        patterns: [ "pytest", "pytest-cov", "ruff", "mypy", "pyinstaller*",
                    "fonttools" ]

  - package-ecosystem: github-actions
    # Корень — workflows; отдельно — общий шаг сборки APK.
    directories: [ "/", "/.github/actions/*" ]
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: [ "*" ]
