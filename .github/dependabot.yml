# Автоматические предложения обновлений зависимостей.
#
# Важно: PR группы runtime (requirements.txt) приходит красным — это
# намеренно, Android-сборка и лицензии не должны отставать незаметно.
# Перед слиянием в той же ветке нужно:
#   1. Поставить те же версии в buildozer.spec (строка requirements) —
#      test_android_pins_match_requirements. pycryptodomex там нет:
#      на Android вместо него рецепт pycryptodome.
#   2. Обновить версии в LICENSES/THIRD-PARTY-NOTICES.txt (команда
#      перегенерации — в начале файла) —
#      test_third_party_notices_cover_runtime_packages.
# Оба теста — в tests/test_project.py.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      runtime:
        patterns: [ "huawei-lte-api", "requests", "urllib3", "certifi",
                    "idna", "charset-normalizer", "xmltodict", "pycryptodomex" ]
      dev-tools:
        patterns: [ "pytest", "pytest-cov", "ruff", "mypy", "pyinstaller*",
                    "fonttools" ]

  - package-ecosystem: github-actions
    # Корень — workflows; отдельно — общий шаг сборки APK.
    directories: [ "/", "/.github/actions/*" ]
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: [ "*" ]
