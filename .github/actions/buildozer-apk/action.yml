name: Build APK with Buildozer
description: >-
  Общие шаги сборки Android APK: подготовка исходников, Python/JDK,
  системные пакеты, Buildozer + Cython, кэш SDK/NDK, сборка.
inputs:
  buildozer-version:
    description: Версия buildozer
    required: true
  mode:
    description: debug или release
    required: true
  cache-prefix:
    description: Префикс ключа кэша ~/.buildozer
    required: true
runs:
  using: composite
  steps:
    # Десктопный main.py — Tkinter-версия, она НЕ должна быть точкой входа
    # на Android. Собираем в отдельной папке, где android_main.py
    # становится main.py. Десктопный main.py в репозитории не трогаем.
    - name: Stage Android sources
      shell: bash
      run: |
        rm -rf build-android
        mkdir -p build-android/LICENSES
        cp android_main.py build-android/main.py
        cp -r core assets buildozer.spec build-android/
        cp LICENSES/*.txt build-android/LICENSES/
        cp LICENSE build-android/LICENSES/Hua4GMon-LICENSE.txt

    # p4a v2024.01.21 собирает Python 3.11 — хост-Python той же версии.
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    # Версии Android-пакетов — из requirements.txt (единственный источник,
    # его обновляет Dependabot). Уведомления о лицензиях — из метаданных тех
    # же версий, установленных в отдельное окружение (не мешают buildozer).
    - name: Pin requirements and generate license notices
      shell: bash
      run: |
        python -m tools.android_requirements build-android/buildozer.spec requirements.txt
        python -m venv "$RUNNER_TEMP/runtime-deps"
        "$RUNNER_TEMP/runtime-deps/bin/pip" install --quiet -r requirements.txt
        "$RUNNER_TEMP/runtime-deps/bin/python" -m tools.third_party_notices \
          requirements.txt build-android/LICENSES/THIRD-PARTY-NOTICES.txt

    # Android Gradle Plugin требует Java 17.
    - uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'

    # Список пакетов — по документации Buildozer для Ubuntu 24.04
    # (libtinfo6 вместо libtinfo5 из 22.04, плюс automake, autopoint, gettext).
    # libltdl-dev: рецепт libffi вызывает макрос LT_SYS_SYMBOL_USCORE из
    # ltdl.m4; в образе 22.04 пакет стоял, в 24.04 его нет.
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip autoconf automake autopoint gettext libtool libltdl-dev \
          pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
          libtinfo6 cmake libffi-dev libssl-dev build-essential ccache

    # Cython 0.29.36 — требование рецептов p4a v2024.01.21 (Kivy 2.3.0, pyjnius).
    - name: Install buildozer + cython
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install "buildozer==${{ inputs.buildozer-version }}" "cython==0.29.36"

    # Кэш — только SDK/NDK (несколько ГБ скачивания). Рецепты p4a (Python,
    # OpenSSL, SDL2, Kivy) компилируются заново в каждой сборке.
    - uses: actions/cache@v6
      with:
        path: ~/.buildozer
        key: ${{ inputs.cache-prefix }}-${{ hashFiles('build-android/buildozer.spec') }}
        restore-keys: |
          ${{ inputs.cache-prefix }}-

    - name: Build APK
      shell: bash
      working-directory: build-android
      run: |
        export ANDROID_ACCEPT_SDK_LICENSE=yes
        # `shell: bash` в GitHub Actions включает pipefail. Когда buildozer
        # завершается, `yes` получает EPIPE и возвращает ошибку — успешная
        # сборка помечалась бы как упавшая. Без pipefail статус шага —
        # статус buildozer (ошибка сборки по-прежнему роняет шаг).
        set +o pipefail
        yes | buildozer -v android ${{ inputs.mode }}
